[project]
name = "overnight-pi-adapter"
version = "0.1.0"
description = "External Pi ACP adapter example for Overnight"
requires-python = ">=3.14"
dependencies = ["overnight[acp]>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_pi"]
