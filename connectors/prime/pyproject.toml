[project]
name = "overnight-prime-adapter"
version = "0.1.0"
description = "Native Prime Agent ACP connector for Overnight"
requires-python = ">=3.14"
dependencies = ["overnight[acp]>=0.1.0", "httpx>=0.28,<1", "httpx-sse>=0.4,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_prime"]
