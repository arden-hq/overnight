[project]
name = "overnight-feather-adapter"
version = "0.1.0"
description = "Native Feather harness adapter for Overnight"
requires-python = ">=3.14,<3.16"
dependencies = ["overnight[feather]>=0.1.0"]

[project.scripts]
overnight-feather = "overnight_feather.host:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_feather"]
