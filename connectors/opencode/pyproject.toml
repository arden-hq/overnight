[project]
name = "overnight-opencode-adapter"
version = "0.1.0"
description = "Native OpenCode ACP adapter for Overnight"
requires-python = ">=3.14,<3.16"
dependencies = ["overnight[acp]>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_opencode"]
