[project]
name = "overnight-tinker"
version = "0.1.0"
description = "Overnight scenario families as tinker-cookbook RL environments"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["tinker-cookbook>=0.6.1,<0.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_tinker"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
