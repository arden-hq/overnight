[project]
name = "overnight-verifiers"
version = "0.1.0"
description = "Overnight scenario families as a verifiers v1 environment for RL trainers"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["verifiers>=0.4.1,<0.5", "aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_verifiers"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
