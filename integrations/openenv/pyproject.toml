[project]
name = "overnight-openenv"
version = "0.1.0"
description = "Overnight scenario families as OpenEnv loop-owning sessions for TRL's async GRPO"
license = "Apache-2.0"
# OpenEnv supports Python 3.10 and newer; TRL 3.11 and newer. Overnight itself is not imported here:
# it runs in its own Python 3.14 environment, named by OVERNIGHT_PYTHON.
requires-python = ">=3.12,<3.15"
dependencies = ["openenv>=0.12,<0.13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_openenv"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
